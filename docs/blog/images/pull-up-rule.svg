<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'IBM Plex Mono', 'Fira Code', monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">The Pull-Up Rule</text>
  <text x="400" y="56" text-anchor="middle" fill="#888" font-size="12">Information buried in a value belongs in the key</text>

  <!-- BEFORE column -->
  <text x="200" y="90" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">BEFORE — verbose</text>
  <rect x="30" y="105" width="340" height="175" rx="6" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1.5" stroke-opacity="0.4"/>

  <text x="50" y="130" fill="#888">- rest-request:</text>
  <text x="50" y="150" fill="#ff6b6b" font-weight="bold">    method: POST</text>
  <text x="50" y="170" fill="#ff6b6b" font-weight="bold">    url: /api/orders</text>
  <text x="50" y="190" fill="#888">    body:</text>
  <text x="50" y="210" fill="#888">      item: widget</text>
  <text x="50" y="230" fill="#888">  timeout: 10s</text>
  <text x="50" y="260" fill="#666" font-size="11">← 6 lines, 2 buried in the value</text>

  <!-- AFTER column -->
  <text x="600" y="90" text-anchor="middle" fill="#51cf66" font-size="14" font-weight="bold">AFTER — compact</text>
  <rect x="430" y="105" width="340" height="140" rx="6" fill="#1e1e3a" stroke="#51cf66" stroke-width="1.5" stroke-opacity="0.4"/>

  <text x="450" y="130" fill="#51cf66" font-weight="bold">- rest-request:POST:</text>
  <text x="450" y="150" fill="#51cf66" font-weight="bold">    /api/orders</text>
  <text x="450" y="170" fill="#888">  body:</text>
  <text x="450" y="190" fill="#888">    item: widget</text>
  <text x="450" y="210" fill="#888">  timeout: 10s</text>
  <text x="450" y="230" fill="#666" font-size="11">← 5 lines, discriminator in key</text>

  <!-- Arrow -->
  <path d="M 385 175 L 418 175" stroke="#e0e0e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
  </defs>

  <!-- Three patterns -->
  <text x="400" y="320" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Three compact patterns</text>

  <!-- Pattern 1: Scalar -->
  <rect x="30" y="340" width="230" height="80" rx="6" fill="#1e1e3a" stroke="#74c0fc" stroke-width="1" stroke-opacity="0.5"/>
  <text x="145" y="362" text-anchor="middle" fill="#74c0fc" font-size="12" font-weight="bold">SCALAR</text>
  <text x="50" y="385" fill="#888" font-size="12">- log: "Done"</text>
  <text x="50" y="405" fill="#666" font-size="11">single required field</text>

  <!-- Pattern 2: Colon -->
  <rect x="280" y="340" width="230" height="80" rx="6" fill="#1e1e3a" stroke="#ffd43b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="395" y="362" text-anchor="middle" fill="#ffd43b" font-size="12" font-weight="bold">COLON — enumerable</text>
  <text x="300" y="385" fill="#888" font-size="12">- rest-request:GET: /url</text>
  <text x="300" y="405" fill="#666" font-size="11">IDE-completable segment</text>

  <!-- Pattern 3: Space -->
  <rect x="530" y="340" width="240" height="80" rx="6" fill="#1e1e3a" stroke="#b197fc" stroke-width="1" stroke-opacity="0.5"/>
  <text x="650" y="362" text-anchor="middle" fill="#b197fc" font-size="12" font-weight="bold">SPACE — user-defined</text>
  <text x="550" y="385" fill="#888" font-size="12">- agent-query svc: "Q"</text>
  <text x="550" y="405" fill="#666" font-size="11">dynamic name in key</text>

  <!-- Bottom rule -->
  <rect x="100" y="450" width="600" height="50" rx="6" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="475" text-anchor="middle" fill="#ff6b6b" font-size="13">When both forms exist, LLMs always generate the verbose one.</text>
  <text x="400" y="493" text-anchor="middle" fill="#888" font-size="12">The fix: remove the verbose form. One syntax, no ambiguity.</text>
</svg>
