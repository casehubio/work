  io.casehub.platform.spring.rest.RestControllersAutoConfiguration,\
  io.casehub.platform.callback.spring.CallbackSpringAutoConfiguration,\
  io.casehub.platform.mcp.spring.McpSpringAutoConfiguration,\
  io.casehub.platform.oidc.spring.OidcSpringAutoConfiguration,\
  io.casehub.platform.agent.claude.spring.AgentClaudeAutoConfiguration,\
  io.casehub.platform.agent.openai.spring.AgentOpenaiAutoConfiguration,\
  io.casehub.platform.agent.codex.spring.AgentCodexAutoConfiguration,\
  io.casehub.platform.agent.gemini.spring.AgentGeminiAutoConfiguration,\
  io.casehub.platform.agent.geminicli.spring.AgentGeminiCliAutoConfiguration,\
  io.casehub.platform.agent.langchain4j.spring.AgentLangchain4jAutoConfiguration,\
  io.casehub.platform.agent.config.spring.AgentConfigAutoConfiguration,\
  io.casehub.platform.agent.router.spring.AgentRouterAutoConfiguration,\
  io.casehub.platform.agent.gate.spring.AgentGateSpringAutoConfiguration,\
  io.casehub.platform.identity.spring.IdentityAutoConfiguration,\
  io.casehub.platform.expression.spring.ExpressionAutoConfiguration,\
  io.casehub.platform.expression.spring.ExpressionSpringAutoConfiguration,\
  io.casehub.platform.view.spring.ViewAutoConfiguration,\
  io.casehub.platform.scim.spring.ScimAutoConfiguration,\
