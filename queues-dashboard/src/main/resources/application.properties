quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:dashboard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/work/migration,classpath:db/view/migration
quarkus.scheduler.start-mode=halted
casehub.work.default-expiry-hours=168
casehub.work.default-claim-hours=24
quarkus.http.test-port=0

